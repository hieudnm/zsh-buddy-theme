name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Versions
        run: zsh --version && git --version

      - name: Syntax check
        run: zsh -n .zshrc && bash -n install.sh

      - name: Run tests
        run: zsh tests/run.zsh
